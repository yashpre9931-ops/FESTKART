<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | FestCart</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f7f7f8; color: #111; }
  
  header { position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 16px 6%; background: #111; color: white; }
  .logo { font-size: 25px; font-weight: 800; cursor: pointer; text-decoration: none; color: white;}
  .logo span { color: #ffb703; }

  .navbar { background-color: #222; padding: 12px 6%; text-align: center; border-bottom: 3px solid #ffb703; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
  .navbar a { color: #fff; text-decoration: none; font-weight: bold; font-size: 14px; padding: 5px 10px; border-radius: 5px; transition: background 0.3s; }
  .navbar a:hover { background-color: #ffb703; color: #111; }

  .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); width: 90%; }
  .container h2 { margin-bottom: 20px; text-align: center; }
  
  label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
  input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
  
  .btn-primary { width: 100%; margin-top: 25px; padding: 15px; border: 0; border-radius: 30px; background: #111; color: white; font-weight: 800; cursor: pointer; font-size: 16px; transition: 0.3s; }
  .btn-primary:hover { background: #333; }
  
  .logout-btn { background: #d93025; margin-top: 15px; width: 100%; padding: 15px; border: 0; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; }
  .logout-btn:hover { background: #b3261e; }

  #counterMessage { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; line-height: 1.6; }
</style>
</head>
<body>

<header>
    <a href="index.html" class="logo">Fest<span>Cart</span></a>
</header>

<nav class="navbar">
    <a href="index.html">🏠 Home / Menu</a>
    <a href="login.html">🔐 Login Portal</a>
    <a href="track.html">📍 Track Order</a>
</nav>

<!-- ⚙️ ADMIN DASHBOARD SECTION -->
<div class="container" id="dashboardSection" style="display: none;">
    <h2>⚙️ Create New Counter</h2>

    <label>Store Name</label>
    <input type="text" id="storeName" placeholder="e.g. Sip and Shake">

    <label>Owner Name</label>
    <input type="text" id="ownerName" placeholder="e.g. Yash">

    <label>Owner Email (Login ID)</label>
    <input type="email" id="ownerEmail" placeholder="e.g. counter1@festcart.com">

    <label>Set Owner Password</label>
    <input type="text" id="ownerPassword" placeholder="e.g. Counter@123 (Min 6 chars)">

    <button class="btn-primary" onclick="createCounter()">Create Counter</button>
    <div id="counterMessage"></div>

    <hr style="margin: 30px 0; border: 1px solid #eee;">
    <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
</div>

<script>
const SUPABASE_URL = "https://pzdtpnvgdbomqmuyzhtv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_DqbtaPNKSD_1ELESNwy54Q_ForkRGvn";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

/* ==============================
   PROTECTED ROUTE (SECURITY)
============================== */
async function checkAuthStatus() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    
    if (!session) {
        // Agar login nahi hai, to wapas login page par fek do
        window.location.href = "login.html";
    } else {
        document.getElementById("dashboardSection").style.display = "block";
    }
}

async function logoutAdmin() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html"; 
}

/* ==============================
   CREATE COUNTER 
============================== */
async function createCounter(){
  const storeName = document.getElementById("storeName").value.trim();
  const ownerName = document.getElementById("ownerName").value.trim();
  const ownerEmail = document.getElementById("ownerEmail").value.trim();
  const ownerPassword = document.getElementById("ownerPassword").value.trim();
  const message = document.getElementById("counterMessage");

  message.style.display = "none";

  if(!storeName || !ownerName || !ownerEmail || !ownerPassword){
    message.innerText = "❌ Please fill all details.";
    message.style.background = "#ffe5e5"; message.style.color = "#b00020"; message.style.display = "block"; return;
  }

  message.innerText = "⏳ Creating stall owner account and store...";
  message.style.background = "#e8f1ff"; message.style.color = "#1456a0"; message.style.display = "block";

  try{
    const { data: authData, error: authError } = await supabaseClient.auth.signUp({ email: ownerEmail, password: ownerPassword });
    if (authError) throw authError;

    const ownerId = authData.user.id;

    const { data: storeData, error: storeError } = await supabaseClient.from('stores').insert([
        { store_name: storeName, owner_name: ownerName, owner_id: ownerId }
    ]);
    if (storeError) throw storeError;

    message.innerHTML = `✅ <b>Counter Created Successfully!</b><br><br>🏪 Store: ${storeName}<br>👤 Owner: ${ownerName}<br>📧 Login ID: ${ownerEmail}<br>🔑 Password: ${ownerPassword}<br><br><i>⚠️ Security Note: To create another counter, please click Logout and log in as Admin again.</i>`;
    message.style.background = "#e7f7ed"; message.style.color = "#137333"; message.style.display = "block";

    document.getElementById("storeName").value = ""; document.getElementById("ownerName").value = ""; 
    document.getElementById("ownerEmail").value = ""; document.getElementById("ownerPassword").value = "";

    await supabaseClient.auth.signOut();
  } catch(error){
    message.innerText = "❌ Error: " + error.message;
    message.style.background = "#ffe5e5"; message.style.color = "#b00020"; message.style.display = "block";
  }
}

checkAuthStatus();
</script>

</body>
</html>
