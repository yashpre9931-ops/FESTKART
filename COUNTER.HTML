<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter Owner Dashboard | FestCart</title>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f7f7f8; color: #111; }
  
  .navbar { background-color: #222; padding: 12px 6%; text-align: center; border-bottom: 3px solid #ffb703; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
  .navbar a { color: #fff; text-decoration: none; font-weight: bold; font-size: 14px; padding: 5px 10px; border-radius: 5px; transition: background 0.3s; }
  .navbar a:hover { background-color: #ffb703; color: #111; }

  .container { max-width: 900px; margin: 40px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); width: 95%; }
  .container h2 { margin-bottom: 20px; text-align: center; }
  
  label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
  input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
  
  .btn-primary { width: 100%; margin-top: 15px; padding: 12px; border: 0; border-radius: 8px; background: #ffb703; color: #111; font-weight: bold; cursor: pointer; transition: 0.3s; }
  .btn-primary:hover { background: #e0a000; }
  
  .btn-dark { background: #111; color: white; }
  .btn-dark:hover { background: #333; }

  .btn-danger { background: #d93025; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;}
  .btn-success { background: #137333; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;}
  .btn-warning { background: #f29900; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;}

  .box { background: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px solid #eee; margin-bottom: 30px; }
  
  /* GRID FOR MENU & ORDERS */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px;}
  @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

  /* CARDS */
  .card { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
  .order-card { background: white; border: 2px solid #ddd; padding: 15px; border-radius: 10px; margin-bottom: 15px;}
  .order-card.new { border-color: #d93025; }
  .order-card.preparing { border-color: #f29900; }
  .order-card.ready { border-color: #137333; }

  #msgBox { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; line-height: 1.6; }
</style>
</head>
<body>

<nav class="navbar">
    <a href="index.html">🏠 Home / Menu</a>
    <a href="admin.html">⚙️ Admin Dashboard</a>
    <a href="COUNTER.HTML">🏪 Counter Owner</a>
    <a href="track.html">📍 Track Order</a>
</nav>

<!-- 🔒 OWNER LOGIN SECTION -->
<div class="container" id="loginSection" style="max-width: 500px;">
    <h2>🏪 Counter Owner Login</h2>
    <p style="text-align:center; color:#777;">Login to manage your counter.</p>
    
    <label>Owner Email</label>
    <input type="email" id="loginEmail" placeholder="e.g. burger@festcart.com">

    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Enter Password">

    <button class="btn-primary" onclick="loginOwner()">Login</button>
    <div id="loginMsg" style="display:none; margin-top:15px; padding:10px; border-radius:8px;"></div>
</div>

<!-- 🏪 OWNER DASHBOARD SECTION -->
<div class="container" id="dashboardSection" style="display: none;">
    <h2>🏪 <span id="displayStoreName" style="color:#ffb703;">Loading...</span> Dashboard</h2>
    
    <button class="btn-dark" style="width:auto; float:right; margin-top:-60px;" onclick="logoutOwner()">Logout</button>
    <div style="clear:both;"></div>

    <div id="msgBox"></div>

    <!-- 🛒 LIVE ORDERS SECTION -->
    <div class="box" style="border-left: 5px solid #ffb703;">
        <h3>🔴 Live Orders <button onclick="loadOrders()" style="float:right; cursor:pointer;">🔄 Refresh</button></h3>
        <p style="color:#777; font-size:14px; margin-bottom:15px;">Update status to notify customers.</p>
        
        <div id="ordersList">
            <p>Loading orders...</p>
        </div>
    </div>

    <!-- 🍔 MENU MANAGEMENT SECTION -->
    <div class="box">
        <h3>🍔 Manage Menu (<span id="itemCount">0</span>/50 Items)</h3>
        
        <div class="grid-2">
            <div>
                <label>Item Name</label>
                <input type="text" id="prodName" placeholder="e.g. Chocolate Shake">
            </div>
            <div>
                <label>Price (₹)</label>
                <input type="number" id="prodPrice" placeholder="e.g. 80">
            </div>
        </div>
        
        <button class="btn-primary btn-dark" onclick="addProduct()">+ Add Item to Menu</button>
        
        <h4 style="margin-top: 25px; margin-bottom: 10px;">Your Current Menu:</h4>
        <div id="menuList">
            <p>Loading menu...</p>
        </div>
    </div>

    <!-- 🎨 STORE SETTINGS -->
    <div class="box">
        <h3>🎨 Store Settings</h3>
        <div class="grid-2">
            <div>
                <label>Store Name</label>
                <input type="text" id="editStoreName">
            </div>
            <div>
                <label>Logo URL</label>
                <input type="text" id="editLogoUrl">
            </div>
        </div>
        <button class="btn-primary" onclick="updateStoreDetails()">Update Profile</button>
    </div>

</div>

<script>
/* ==============================
   SUPABASE CONFIG
============================== */
const SUPABASE_URL = "https://pzdtpnvgdbomqmuyzhtv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_DqbtaPNKSD_1ELESNwy54Q_ForkRGvn";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let currentStoreId = null;

/* ==============================
   CHECK AUTH & LOAD
============================== */
async function checkAuthStatus() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("dashboardSection").style.display = "block";
        loadOwnerStoreData(session.user.id);
    } else {
        document.getElementById("loginSection").style.display = "block";
        document.getElementById("dashboardSection").style.display = "none";
    }
}

/* ==============================
   LOGIN & LOGOUT
============================== */
async function loginOwner() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();
    const msg = document.getElementById("loginMsg");
    msg.style.display = "none";

    if(!email || !password) return alert("Enter email and password!");

    msg.innerText = "⏳ Logging in..."; msg.style.display = "block";
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
        msg.innerText = "❌ " + error.message;
    } else {
        document.getElementById("loginEmail").value = "";
        document.getElementById("loginPassword").value = "";
        checkAuthStatus(); 
    }
}

async function logoutOwner() {
    await supabaseClient.auth.signOut();
    currentStoreId = null;
    checkAuthStatus(); 
}

/* ==============================
   LOAD STORE DATA
============================== */
async function loadOwnerStoreData(userId) {
    const { data, error } = await supabaseClient.from('stores').select('*').eq('owner_id', userId).single();
    if (data) {
        currentStoreId = data.id;
        document.getElementById("displayStoreName").innerText = data.store_name;
        document.getElementById("editStoreName").value = data.store_name || "";
        document.getElementById("editLogoUrl").value = data.logo_url || "";
        
        loadProducts(); // Load Menu
        loadOrders();   // Load Orders
        
        // Auto refresh orders every 15 seconds
        setInterval(loadOrders, 15000); 
    }
}

async function updateStoreDetails() {
    const newName = document.getElementById("editStoreName").value.trim();
    const newLogo = document.getElementById("editLogoUrl").value.trim();
    if(!newName) return alert("Store name required");
    await supabaseClient.from('stores').update({ store_name: newName, logo_url: newLogo }).eq('id', currentStoreId);
    document.getElementById("displayStoreName").innerText = newName;
    alert("Store Updated!");
}

/* ==============================
   MENU MANAGEMENT (Max 50, Stock)
============================== */
async function loadProducts() {
    const { data, error } = await supabaseClient.from('products').select('*').eq('store_id', currentStoreId);
    const list = document.getElementById("menuList");
    
    if (error) { list.innerHTML = "Error loading menu."; return; }
    
    document.getElementById("itemCount").innerText = data.length;
    
    if (data.length === 0) { list.innerHTML = "<p>No items added yet.</p>"; return; }

    list.innerHTML = "";
    data.forEach(item => {
        const stockColor = item.is_available ? "green" : "red";
        const stockText = item.is_available ? "✅ In Stock" : "❌ Out of Stock";
        
        list.innerHTML += `
            <div class="card">
                <div>
                    <strong>${item.name}</strong> - ₹${item.price}
                    <br><small style="color:${stockColor}">${stockText}</small>
                </div>
                <div>
                    <button class="btn-warning" onclick="toggleStock('${item.id}', ${item.is_available})">Toggle Stock</button>
                    <button class="btn-danger" onclick="deleteProduct('${item.id}')">🗑️</button>
                </div>
            </div>
        `;
    });
}

async function addProduct() {
    const name = document.getElementById("prodName").value.trim();
    const price = document.getElementById("prodPrice").value.trim();
    
    if(!name || !price) return alert("Please enter Name and Price.");

    // Check Max 50 limit
    const currentCount = parseInt(document.getElementById("itemCount").innerText);
    if(currentCount >= 50) return alert("❌ Maximum 50 items allowed per store!");

    const { error } = await supabaseClient.from('products').insert([
        { store_id: currentStoreId, name: name, price: price, is_available: true }
    ]);

    if(error) alert("Error adding item: " + error.message);
    else {
        document.getElementById("prodName").value = "";
        document.getElementById("prodPrice").value = "";
        loadProducts();
    }
}

async function toggleStock(id, currentStatus) {
    await supabaseClient.from('products').update({ is_available: !currentStatus }).eq('id', id);
    loadProducts();
}

async function deleteProduct(id) {
    if(confirm("Delete this item?")) {
        await supabaseClient.from('products').delete().eq('id', id);
        loadProducts();
    }
}

/* ==============================
   LIVE ORDER MANAGEMENT
============================== */
async function loadOrders() {
    // Sirf New, Preparing aur Ready orders dikhayenge (Completed hide kar denge current view se)
    const { data, error } = await supabaseClient
        .from('bookings')
        .select('*')
        .eq('store_id', currentStoreId)
        .neq('status', 'completed')
        .order('created_at', { ascending: false });

    const list = document.getElementById("ordersList");
    if (error) { list.innerHTML = "Error loading orders."; return; }
    
    if (data.length === 0) { list.innerHTML = "<p>No active orders right now.</p>"; return; }

    list.innerHTML = "";
    data.forEach(order => {
        
        // Parse items array to string
        let itemsList = "";
        try {
            const items = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
            items.forEach(i => { itemsList += `${i.quantity}x ${i.name}, `; });
        } catch(e) { itemsList = "Items data error"; }

        let buttonsHTML = "";
        if(order.status === 'new') {
            buttonsHTML = `<button class="btn-warning" onclick="updateOrder('${order.booking_id}', 'preparing', true)">Start Preparing (Set Time)</button>`;
        } else if(order.status === 'preparing') {
            buttonsHTML = `<button class="btn-success" onclick="updateOrder('${order.booking_id}', 'ready', false)">Mark as Ready!</button>`;
        } else if(order.status === 'ready') {
            buttonsHTML = `<button class="btn-dark" onclick="updateOrder('${order.booking_id}', 'completed', false)">Handed Over (Complete)</button>`;
        }

        list.innerHTML += `
            <div class="order-card ${order.status}">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <strong>ID: ${order.booking_id}</strong>
                    <span style="text-transform:uppercase; font-weight:bold;">Status: ${order.status}</span>
                </div>
                <p>👤 <b>Customer:</b> ${order.customer_name} (${order.phone})</p>
                <p>🛍️ <b>Items:</b> ${itemsList}</p>
                <p>💰 <b>Total:</b> ₹${order.total_amount}</p>
                <p style="color:#1456a0; font-weight:bold;">⏱️ Estimated Pickup: ${order.pickup_time || 'Pending'}</p>
                <div style="margin-top:15px; text-align:right;">
                    ${buttonsHTML}
                </div>
            </div>
        `;
    });
}

async function updateOrder(bookingId, newStatus, askTime) {
    let updateData = { status: newStatus };
    
    if(askTime) {
        let timeInput = prompt("Order kitne time me ready hoga? (e.g., '10 mins' ya '5:30 PM')");
        if(timeInput) {
            updateData.pickup_time = timeInput;
        } else {
            return; // agar owner ne cancel kiya toh update mat karo
        }
    }

    const { error } = await supabaseClient.from('bookings').update(updateData).eq('booking_id', bookingId);
    if(error) alert("Update failed!");
    else loadOrders();
}

checkAuthStatus();
</script>

</body>
</html>
