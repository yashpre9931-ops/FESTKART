<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order | FestCart</title>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f7f7f8; color: #111; }
  
  header { position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 16px 6%; background: #111; color: white; }
  .logo { font-size: 25px; font-weight: 800; cursor: pointer; text-decoration: none; color: white;}
  .logo span { color: #ffb703; }

  .navbar { background-color: #222; padding: 12px 6%; text-align: center; border-bottom: 3px solid #ffb703; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
  .navbar a { color: #fff; text-decoration: none; font-weight: bold; font-size: 14px; padding: 5px 10px; border-radius: 5px; transition: background 0.3s; }
  .navbar a:hover { background-color: #ffb703; color: #111; }

  .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); width: 90%; text-align: center; }
  .container h2 { margin-bottom: 10px; }
  .container p { color: #777; margin-bottom: 25px; }
  
  input { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 8px; outline: none; font-size: 18px; text-align: center; text-transform: uppercase; font-weight: bold; letter-spacing: 2px;}
  input:focus { border-color: #ffb703; }

  .btn-primary { width: 100%; margin-top: 20px; padding: 15px; border: 0; border-radius: 30px; background: #111; color: white; font-weight: 800; cursor: pointer; font-size: 16px; transition: 0.3s; }
  .btn-primary:hover { background: #ffb703; color: #111; }

  /* TRACKING RESULT BOX */
  #resultBox { display: none; margin-top: 30px; text-align: left; padding: 20px; border-radius: 15px; background: #f9f9f9; border: 1px solid #eee; }
  .status-badge { display: inline-block; padding: 8px 15px; border-radius: 20px; font-weight: bold; color: white; font-size: 14px; text-transform: uppercase; margin-bottom: 15px; }
  
  .status-new { background: #d93025; }
  .status-preparing { background: #f29900; }
  .status-ready { background: #137333; }
  .status-completed { background: #111; }

  .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #ddd; }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: #777; font-weight: bold; }
  .detail-value { font-weight: bold; text-align: right; }
  
  #msgBox { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; font-weight: bold; }
</style>
</head>
<body>

<header>
    <a href="index.html" class="logo">Fest<span>Cart</span></a>
</header>

<nav class="navbar">
    <a href="index.html">🏠 Home / Menu</a>
    <a href="admin.html">⚙️ Admin Dashboard</a>
    <a href="COUNTER.HTML">🏪 Counter Owner</a>
    <a href="track.html">📍 Track Order</a>
</nav>

<div class="container">
    <h2>📍 Track Your Order</h2>
    <p>Enter your <b>Booking ID</b> to check live status.</p>

    <input type="text" id="orderIdInput" placeholder="e.g. FC-1234">
    <button class="btn-primary" onclick="trackOrder()">Track Now</button>

    <div id="msgBox"></div>

    <!-- ORDER DETAILS SHOW HERE -->
    <div id="resultBox">
        <div style="text-align: center;">
            <div id="statusBadge" class="status-badge status-new">Status</div>
        </div>

        <div class="detail-row">
            <span class="detail-label">Booking ID</span>
            <span class="detail-value" id="resOrderId"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Customer</span>
            <span class="detail-value" id="resName"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Estimated Pickup</span>
            <span class="detail-value" id="resTime" style="color: #1456a0;"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Payment</span>
            <span class="detail-value" id="resPayment"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Total Amount</span>
            <span class="detail-value">₹<span id="resTotal"></span></span>
        </div>
    </div>
</div>

<script>
/* ==============================
   SUPABASE CONFIG
============================== */
const SUPABASE_URL = "https://pzdtpnvgdbomqmuyzhtv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_DqbtaPNKSD_1ELESNwy54Q_ForkRGvn";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

/* ==============================
   TRACK ORDER FUNCTION
============================== */
async function trackOrder() {
    let orderId = document.getElementById("orderIdInput").value.trim().toUpperCase();
    const msg = document.getElementById("msgBox");
    const resultBox = document.getElementById("resultBox");

    msg.style.display = "none";
    resultBox.style.display = "none";

    if(!orderId) {
        msg.innerText = "❌ Please enter a valid Order ID.";
        msg.style.background = "#ffe5e5"; msg.style.color = "#b00020"; msg.style.display = "block";
        return;
    }

    // "FC-" lagana bhool gaya ho toh auto lagao
    if(!orderId.startsWith("FC-")) {
        orderId = "FC-" + orderId;
    }

    msg.innerText = "⏳ Searching for order...";
    msg.style.background = "#e8f1ff"; msg.style.color = "#1456a0"; msg.style.display = "block";

    const { data, error } = await supabaseClient
        .from('bookings')
        .select('*')
        .eq('booking_id', orderId)
        .single();

    if (error || !data) {
        msg.innerText = "❌ Order not found! Check your Booking ID.";
        msg.style.background = "#ffe5e5"; msg.style.color = "#b00020"; msg.style.display = "block";
    } else {
        msg.style.display = "none"; // Hide loading message
        
        // Populate Data
        document.getElementById("resOrderId").innerText = data.booking_id;
        document.getElementById("resName").innerText = data.customer_name;
        document.getElementById("resTime").innerText = data.pickup_time || "Pending...";
        document.getElementById("resTotal").innerText = data.total_amount;
        
        let paymentInfo = data.payment_mode === 'online' ? "Online (UPI)" : "Pay at Counter";
        document.getElementById("resPayment").innerText = paymentInfo;

        // Set Status Badge
        const badge = document.getElementById("statusBadge");
        badge.className = "status-badge"; // reset classes
        
        if (data.status === 'new') {
            badge.innerText = "🔴 Pending at Counter";
            badge.classList.add("status-new");
        } else if (data.status === 'preparing') {
            badge.innerText = "🟡 Preparing Food";
            badge.classList.add("status-preparing");
        } else if (data.status === 'ready') {
            badge.innerText = "🟢 Ready for Pickup!";
            badge.classList.add("status-ready");
        } else if (data.status === 'completed') {
            badge.innerText = "✅ Order Completed";
            badge.classList.add("status-completed");
        }

        resultBox.style.display = "block";
    }
}
</script>

</body>
</html>
